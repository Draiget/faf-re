name: Replay parity

# Plays FAF vault replays of one game version on the Linux headless build and checks every
# checksum the live players recorded, as tools/replay-parity does on Windows: same verdicts, and a
# desync one live client had alone is not ours. Plays from the caches the Parity prewarm workflow
# fills; it fetches from FAF only what they lack. tools/parity-data/README.md.
#
# Run it from master (its caches are the ones every run can read) with the commit to test.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to build and test
        required: true
        default: master
      set:
        description: Replays to play
        type: choice
        options: [core, extended, sample, all]
        default: core
      sample:
        description: Replays for set=sample
        default: "1000"
      seed:
        description: Random order of the sample (and of what set=all leaves out past 256 jobs)
        default: "1"
      game_version:
        description: FAF game version of the replays
        default: "3835"

permissions:
  contents: read

concurrency:
  group: replay-parity
  cancel-in-progress: false

env:
  GAME_VERSION: ${{ inputs.game_version }}
  PYTHON_VERSION: "3.14"
  # Jobs play for this long; plan.py packs shards to it, shard.py starts nothing that would not
  # end by then. A job may run 360 minutes in all.
  PLAY_MINUTES: "300"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # The pinned toolchain (cmake/toolchains/linux-clang-pins.cmake): configure refuses another.
      - run: |
          sudo apt-get update
          v=1:18.1.3-1ubuntu1
          sudo apt-get install -y --no-install-recommends ninja-build \
            clang-18=$v lld-18=$v libc++-18-dev=$v libc++abi-18-dev=$v libunwind-18-dev=$v
      - uses: actions/cache@v6
        with:
          path: dependencies/.downloads
          key: deps-${{ hashFiles('cmake/FafDependencies.cmake') }}
      - run: cmake -DFAF_DEPENDENCIES_ONLY="WildMagic3p8;zlib-1.2.3;boost_1_34_1" -P cmake/FafDependencies.cmake
      - run: cmake --preset linux-clang-x64-release
      - run: cmake --build --preset linux-clang-x64-release --target headless
      - run: echo "Built $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: headless
          path: build/linux-clang-x64-release/headless
          retention-days: 7

  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # What the prewarm learnt about each replay (ready, or why not). Without it every corpus
      # replay is scheduled and the jobs check them.
      - uses: actions/cache/restore@v6
        with:
          path: cache/index
          key: index-${{ env.GAME_VERSION }}-latest
          restore-keys: index-${{ env.GAME_VERSION }}-
      - id: plan
        run: >
          mkdir -p cache/index &&
          python tools/parity-data/plan.py --corpus tools/parity-data/corpus/$GAME_VERSION.tsv.gz --index cache/index
          --set ${{ inputs.set }} --sample ${{ inputs.sample }} --seed ${{ inputs.seed }} --slots 4
          --budget-minutes "$PLAY_MINUTES" --out plan.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: plan
          path: plan.json
          retention-days: 30

  run:
    needs: [build, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    # PARITY_RETAIL_KEY is this environment's secret, given to master only.
    environment: parity
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: run (shard ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: headless
          path: bin
      - uses: actions/download-artifact@v8
        with:
          name: plan
      - uses: actions/cache/restore@v6
        with:
          path: game
          key: game-${{ env.GAME_VERSION }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v6
        with:
          path: retail.enc
          key: retail-${{ vars.PARITY_RETAIL_ID }}
          fail-on-cache-miss: true
      # The pack: FAF's game files with the retail archives in fa/gamedata.
      - env:
          KEY: ${{ secrets.PARITY_RETAIL_KEY }}
        run: |
          KEY="$(printf '%s' "$KEY" | tr -d '[:space:]')"; export KEY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY -in retail.enc | tar -xJf - -C game
          rm retail.enc
          chmod +x bin/headless
      - uses: actions/cache/restore@v6
        with:
          path: cache/maps
          key: maps-${{ env.GAME_VERSION }}-latest
          restore-keys: maps-${{ env.GAME_VERSION }}-
      - uses: actions/cache/restore@v6
        with:
          path: cache/m28
          key: m28-${{ env.GAME_VERSION }}-latest
          restore-keys: m28-${{ env.GAME_VERSION }}-
      - if: matrix.bucket >= 0
        uses: actions/cache/restore@v6
        with:
          path: cache/replays
          key: replays-${{ env.GAME_VERSION }}-b${{ matrix.bucket }}-latest
          restore-keys: replays-${{ env.GAME_VERSION }}-b${{ matrix.bucket }}-
      - run: >
          mkdir -p cache/replays cache/maps cache/m28 &&
          python tools/parity-data/shard.py --plan plan.json --shard ${{ matrix.shard }} --headless bin/headless
          --pack game --replays cache/replays --maps cache/maps --m28 cache/m28 --work work
          --out results --minutes "$PLAY_MINUTES" --game-version "$GAME_VERSION"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.shard }}
          path: results
          retention-days: 30

  report:
    needs: [plan, run]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: plan
      - uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: results
      - run: >
          python tools/parity-data/report.py --plan plan.json --results results
          --expected tools/parity-data/expected/$GAME_VERSION.json --out report
          --title "Replay parity: ${{ inputs.ref }}, set ${{ inputs.set }}, game version $GAME_VERSION"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: report
          retention-days: 90
