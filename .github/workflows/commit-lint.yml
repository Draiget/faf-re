name: Commit titles

# Checks the PR title and the PR's commits (or, on a push, the pushed commits)
# against the Conventional Commits rules in CONTRIBUTING.md.
# pull_request_target checks out the base branch, so the PR cannot change the
# check it is held to; no code from the PR is run. "edited" reruns it after a
# title change.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: commit-lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  commit-titles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/commit-lint.js');
            await run({ github, context, core });
