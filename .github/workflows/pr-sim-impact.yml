name: PR sim impact

# Checks the PR description against the template: an Evidence section, one sim
# impact box ticked, no "None" on sim code, and played replays on x64 and x86 for
# every PR that changes more than documentation and CI.
# pull_request_target checks out the base branch, so the PR cannot change the
# check it is held to; no code from the PR is run.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  sim-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/pr-sim-impact.js');
            await run({ github, context, core });
