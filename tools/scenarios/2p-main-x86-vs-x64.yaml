name: 2p-main-x86-vs-x64
description: >
  The recovered engine's x86 build (main.exe) against its x64 build
  (main_x64.exe) in one match. Both simulate every beat and exchange
  checksums, so any divergence between the two builds surfaces as a GPGNet
  "Desync" report, and a crash as an unexpected process exit.
timeout: 20m

mode: direct
lobby: auto
map: SCMP_009

game:
  exe: '%ProgramData%\FAForever\bin\main.exe'
  nosound: true
  tile: true

players:
  - { uid: 1, name: MainX86 }
  - { uid: 2, name: MainX64, exe: '%ProgramData%\FAForever\bin\main_x64.exe' }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 8m }
  - wait: 5m

expect:
  allLaunched: true
  noDesync: true
  noCrash: true
