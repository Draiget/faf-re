name: 3p-rejoin-native
description: >
  A crash with no ICE adapter at all (docs/LAUNCHER_NATIVE_NETWORK.md). The game's links die
  with it. mpemu plays the changed FAF client: it stays up, starts the game again with /rejoin
  and player ids, and sends it the peers again, so the game builds new links. FAF_TEST_BIND:
  see 2p-contract-bridge.yaml. Run with -advertise and -turn-ip set to that address. Uses
  mpemu-rejoin-orders. Do not click into the game windows.
timeout: 20m

mode: contract
contract:
  adapter: native
  nativeBind: '%FAF_TEST_BIND%'
lobby: auto
map: faf_re_lockstep
gameOptions:
  LockstepAI: rush
  Victory: sandbox
  DisconnectionDelay02: '90'

game:
  exe: '%ProgramData%\FAForever\bin_x64\rejoin_test.exe'
  init: init_mpemu_rejoin_orders.lua
  nosound: true
  tile: true
  saveReplays: true

players:
  - { uid: 1, name: Stays, faction: uef, args: ['/rejoinoffer', '/title', 'rejoin-orders-stays', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }
  - { uid: 2, name: Rejoins, faction: cybran, args: ['/rejoinoffer', '/title', 'rejoin-orders-back', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }
  - { uid: 3, name: Behind, faction: aeon, args: ['/rejoinoffer', '/title', 'rejoin-orders-behind', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 6m }
  - wait: 4m
  - kill: 2
  - wait: 15s
  - note: player 2 restarts and takes its seat back
  - rejoin: { uid: 2, source: 1, launcher: true, peers: [{ uid: 1, source: 0 }, { uid: 3, source: 2 }] }
  - wait: 3m

expect:
  allLaunched: true
  noDesync: true
  noCrash: true
  logsContain:
    - { uids: [1, 3], pattern: 'rejoin-test: order first \d+ from source 2 ' }
    - { uids: [1, 3], pattern: 'rejoin-test: order back \d+ from source 2 ' }
    - { uids: [2], suffix: '-rejoin', pattern: 'rejoin-test: order back \d+ from source 2 ' }
    - { uids: [1, 3], pattern: 'REJOIN: client \d+ proved its seat' }
    - { uids: [1, 2, 3], pattern: 'REJOIN: told the launcher this client could come back: source \d, 1=0,2=1,3=2' }
    - { uids: [2], suffix: '-rejoin', pattern: 'GPGNET: coming back to a running game' }
    - { uids: [2], suffix: '-rejoin', pattern: 'NETLINK: native mode' }
    - { uids: [1, 2, 3], pattern: 'NETLINK: native mode' }
  logsAbsent:
    - { uids: [2], suffix: '-rejoin', pattern: 'GPGNET: entering idle state' }
    - { uids: [2], suffix: '-rejoin', pattern: 'GPGNET: entering lobby state' }
    - { uids: [1, 3], pattern: 'has been abandoned by all players' }
    - { uids: [1, 3], pattern: 'mismatched' }
    - { uids: [1, 3], pattern: 'rejoin-test: order back \d+ from source [13] ' }
    - { uids: [2], suffix: '-rejoin', pattern: 'mismatched' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: refused' }
