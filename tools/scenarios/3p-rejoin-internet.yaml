name: 3p-rejoin-internet
description: >
  A rejoin over links like the internet's: 100 ms round trip and 1% of packets lost
  between player 2 and the others, in place from before the kill to the end. Player 2
  is killed at 4 minutes and comes back 15 s later. A wider window that resends too much
  when packets are lost shows here; the log says how long the save took to arrive. Needs
  init_mpemu_localvault.lua in the FAF bin folder. Do not click into the game windows.
timeout: 25m

mode: relay
lobby: auto
map: faf_re_lockstep
gameOptions:
  LockstepAI: rush
  Victory: sandbox
  DisconnectionDelay02: '300'

game:
  exe: '%ProgramData%\FAForever\bin_x64\rejoin_test.exe'
  init: init_mpemu_localvault.lua
  nosound: true
  tile: true
  saveReplays: true

players:
  - { uid: 1, name: Stays, faction: uef, args: ['/title', 'rejoin-net-stays', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500;net_LogTraffic=100'] }
  - { uid: 2, name: Rejoins, faction: cybran, args: ['/title', 'rejoin-net-back', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500;net_LogTraffic=100'] }
  - { uid: 3, name: Behind, faction: aeon, args: ['/title', 'rejoin-net-behind', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500;net_LogTraffic=100'] }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 6m }
  - link: { from: 1, to: 2, latency: 50ms, jitter: 5ms, loss: 0.01 }
  - link: { from: 3, to: 2, latency: 50ms, jitter: 5ms, loss: 0.01 }
  - wait: 4m
  - kill: 2
  - wait: 15s
  - note: player 2 restarts and takes its seat back
  - rejoin: { uid: 2, source: 1, peers: [{ uid: 1, source: 0 }, { uid: 3, source: 2 }] }
  - wait: 5m

expect:
  allLaunched: true
  noDesync: true
  noCrash: true
  logsContain:
    - { uids: [1, 3], pattern: 'REJOIN: client \d+ proved its seat' }
    - { uids: [1, 3], pattern: 'REJOIN: client \d+:\S+ served' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: caught up' }
    - { uids: [1, 3], pattern: 'REJOIN: showing Rejoins as back' }
  logsAbsent:
    - { uids: [1, 3], pattern: 'has been abandoned by all players' }
    - { uids: [1, 3], pattern: 'mismatched' }
    - { uids: [2], suffix: '-rejoin', pattern: 'mismatched' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: refused' }
