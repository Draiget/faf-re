name: 2p-main-x86-vs-x64-prebuilt-synclog
description: >
  2p-main-x86-vs-x64-prebuilt with /synclog on both clients: each writes one
  checksum log per beat (every value fed into the sim MD5, with the running
  digest after each), so the x86 and x64 builds can be compared beat by beat
  rather than only at the in-game desync check.
timeout: 12m

mode: direct
lobby: auto
map: SCMP_009
gameOptions:
  PrebuiltUnits: 'On'

game:
  exe: '%ProgramData%\FAForever\bin\main.exe'
  nosound: true
  tile: true

players:
  - { uid: 1, name: MainX86, args: ['/synclog', 'G:\projects\faf-main\tools\runs\synclog\x86'] }
  - { uid: 2, name: MainX64, exe: '%ProgramData%\FAForever\bin\main_x64.exe', args: ['/synclog', 'G:\projects\faf-main\tools\runs\synclog\x64'] }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 4m }
  - wait: 3m

expect:
  allLaunched: true
  noDesync: true
  noCrash: true
