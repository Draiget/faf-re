name: 3p-rejoin-native-wrongkey
description: >
  3p-rejoin-wrongkey with no ICE adapter (docs/LAUNCHER_NATIVE_NETWORK.md): a game on a real
  link holding another player's key gets nothing. FAF_TEST_BIND: see 2p-contract-bridge.yaml.
  Run with -advertise and -turn-ip set to that address. Player 2 offers to player 3 and answers
  player 1, so the refusal from player 3 comes before player 1's next offer: player 1 sees no proof.
timeout: 20m

mode: contract
contract:
  adapter: native
  nativeBind: '%FAF_TEST_BIND%'
lobby: auto
map: faf_re_lockstep
gameOptions:
  LockstepAI: rush
  Victory: sandbox
  DisconnectionDelay02: '90'

game:
  exe: '%ProgramData%\FAForever\bin_x64\rejoin_test.exe'
  init: init_mpemu_localvault.lua
  nosound: true
  tile: true
  saveReplays: true

players:
  - { uid: 1, name: Stays, faction: uef, args: ['/title', 'rejoin-demo-stays', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0'] }
  - { uid: 2, name: Rejoins, faction: cybran, args: ['/title', 'rejoin-demo-back', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0'] }
  - { uid: 3, name: Behind, faction: aeon, args: ['/title', 'rejoin-demo-behind', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0'] }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 6m }
  - wait: 2m
  - kill: 2
  - wait: 10s
  - note: player 2's seat is asked for with player 3's key
  - rejoin: { uid: 2, source: 1, keyOf: 3, peers: [{ uid: 1, source: 0 }, { uid: 3, source: 2 }] }
  - wait: 70s

expect:
  allLaunched: true
  noDesync: true
  noCrash: true
  logsContain:
    - { uids: [3], pattern: 'REJOIN: client \d+:\S+ gave its seat.s key' }
    - { uids: [3], pattern: 'REJOIN: client \d+:\S+ is asked to prove its seat' }
    - { uids: [3], pattern: 'REJOIN: client \d+ proof failed|REJOIN: client \d+.s proof failed' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: refused: The other players did not accept' }
  logsAbsent:
    - { uids: [1, 3], pattern: 'REJOIN: client \d+:\S+ came back on a new link' }
    - { uids: [1, 3], pattern: 'REJOIN: sending client' }
    - { uids: [1, 3], pattern: 'REJOIN: client \d+:\S+ served' }
    - { uids: [1, 3], pattern: 'REJOIN: client \d+ proved its seat' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: received' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: loading the save' }
