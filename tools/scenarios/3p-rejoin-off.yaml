name: 3p-rejoin-off
description: >
  The players' net_RejoinAccept stays at its default, off. Player 2 is killed at 4 minutes
  and restarts 15 s later asking for its seat. It must be turned away with nothing of the
  game, and the other two go on as in any game. Uses mpemu-rejoin-orders. Do not click into
  the game windows.
timeout: 20m

mode: relay
lobby: auto
map: faf_re_lockstep
gameOptions:
  LockstepAI: rush
  Victory: sandbox
  DisconnectionDelay02: '90'

game:
  exe: '%ProgramData%\FAForever\bin_x64\rejoin_test.exe'
  init: init_mpemu_rejoin_orders.lua
  nosound: true
  tile: true
  saveReplays: true

players:
  - { uid: 1, name: Stays, faction: uef, args: ['/title', 'rejoin-orders-stays', '/con', 'net_PeerFeatures=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }
  - { uid: 2, name: Rejoins, faction: cybran, args: ['/title', 'rejoin-orders-back', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }
  - { uid: 3, name: Behind, faction: aeon, args: ['/title', 'rejoin-orders-behind', '/con', 'net_PeerFeatures=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 6m }
  - wait: 4m
  - kill: 2
  - wait: 15s
  - note: player 2 restarts and takes its seat back
  - rejoin: { uid: 2, source: 1, peers: [{ uid: 1, source: 0 }, { uid: 3, source: 2 }] }
  - wait: 3m

expect:
  allLaunched: true
  noDesync: true
  noCrash: true
  logsContain:
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: refused: Not every player answered' }
  logsAbsent:
    - { uids: [1, 3], pattern: 'proved its seat' }
    - { uids: [1, 3], pattern: 'REJOIN: sending client' }
    - { uids: [1, 3], pattern: 'came back on a new link' }
    - { uids: [1, 3], pattern: 'mismatched' }
