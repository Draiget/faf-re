name: 3p-rejoin-order-burst
description: >
  Orders during a handover. Every client sends a test command four times a second
  (mpemu-rejoin-orders, /testordersfast), so some fall between a peer taking the new link
  and sending its backlog, and between one peer sending its backlog and another. Each must
  run once, or the player coming back differs from the others. Do not click into the game
  windows.
timeout: 20m

mode: relay
lobby: auto
map: faf_re_lockstep
gameOptions:
  LockstepAI: rush
  Victory: sandbox
  DisconnectionDelay02: '90'

game:
  exe: '%ProgramData%\FAForever\bin_x64\rejoin_test.exe'
  init: init_mpemu_rejoin_orders.lua
  nosound: true
  tile: true
  saveReplays: true

players:
  - { uid: 1, name: Stays, faction: uef, args: ['/testordersfast', '/title', 'rejoin-orders-stays', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }
  - { uid: 2, name: Rejoins, faction: cybran, args: ['/testordersfast', '/title', 'rejoin-orders-back', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }
  - { uid: 3, name: Behind, faction: aeon, args: ['/testordersfast', '/title', 'rejoin-orders-behind', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 6m }
  - wait: 4m
  - kill: 2
  - wait: 15s
  - note: player 2 restarts and takes its seat back
  - rejoin: { uid: 2, source: 1, peers: [{ uid: 1, source: 0 }, { uid: 3, source: 2 }] }
  - wait: 3m

expect:
  allLaunched: true
  noDesync: true
  noCrash: true
  logsContain:
    - { uids: [1, 3], pattern: 'rejoin-test: order first \d+ from source 2 ' }
    - { uids: [1, 3], pattern: 'rejoin-test: order back \d+ from source 2 ' }
    - { uids: [2], suffix: '-rejoin', pattern: 'rejoin-test: order back \d+ from source 2 ' }
    - { uids: [1, 3], pattern: 'REJOIN: client \d+ proved its seat' }
  logsAbsent:
    - { uids: [1, 3], pattern: 'has been abandoned by all players' }
    - { uids: [1, 3], pattern: 'mismatched' }
    - { uids: [1, 3], pattern: 'rejoin-test: order back \d+ from source [13] ' }
    - { uids: [2], suffix: '-rejoin', pattern: 'mismatched' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: refused' }
