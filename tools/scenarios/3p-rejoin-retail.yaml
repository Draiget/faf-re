name: 3p-rejoin-retail
description: >
  Issue #275's rule: with a retail client in the game, nothing about rejoin
  changes anything. The shipped game and two of our x64 clients, the switches on
  for ours. Player 2 is killed and no seat is held: the survivors' Connectivity
  dialogs eject it about 85 s later, as in the original game, and they play on to
  the same state. An ejected player's army logs no "abandoned" line on this map, so
  the checks don't ask for one. Needs init_mpemu_localvault.lua in the FAF bin
  folder. Do not click into the game windows.
timeout: 15m

mode: direct
lobby: auto
map: faf_re_lockstep
gameOptions:
  LockstepAI: rush
  Victory: sandbox
  DisconnectionDelay02: '30'

game:
  exe: '%ProgramData%\FAForever\bin\ForgedAlliance.exe'
  init: init_mpemu_localvault.lua
  nosound: true
  tile: true
  saveReplays: true

players:
  - { uid: 1, name: Retail, faction: uef }
  - { uid: 2, name: Killed, faction: cybran, exe: '%ProgramData%\FAForever\bin_x64\rejoin_test.exe', args: ['/con', 'net_PeerFeatures=1;net_RejoinAccept=1'] }
  - { uid: 3, name: Stays, faction: aeon, exe: '%ProgramData%\FAForever\bin_x64\rejoin_test.exe', args: ['/con', 'net_PeerFeatures=1;net_RejoinAccept=1'] }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 6m }
  - wait: 2m
  - note: killing player 2
  - kill: 2
  - wait: 240s

expect:
  allLaunched: true
  noDesync: true
  noCrash: true
  present:
    - { uid: 1, cmd: BottleneckCleared }
    - { uid: 3, cmd: BottleneckCleared }
  logsContain:
    - { uids: [3], pattern: 'PEERS: everyone supports OrderStreamCheck: no' }
    - { uids: [1, 3], pattern: 'Connection dialogue opening due to disconnection' }
  logsAbsent:
    # The two of ours still trade seat keys ("gave its seat's key"); retail never gets them. Any line
    # that means rejoin acted fails: a held seat, an offer to the launcher, a seat taken back.
    - { uids: [3], pattern: 'REJOIN: (link to client|told the launcher|client \d+ proved|client \d+:\S+ came back|client \d+:\S+ is asked|taking source|received a save|caught up)' }
    - { uids: [3], pattern: 'mismatched' }
  logsAgree:
    - { uids: [1, 3], pattern: 'faf_re_lockstep: (status tick=2401 .*)' }
