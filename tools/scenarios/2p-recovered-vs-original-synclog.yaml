name: 2p-recovered-vs-original-synclog
description: >
  2p-recovered-vs-original with /synclog on both clients: each writes one
  checksum log per beat (every value fed into the sim MD5, with the running
  digest after each), so the first diverging input between the shipped engine
  and the recovery can be found by diffing the same beat's two logs.
timeout: 8m

mode: direct
lobby: auto
map: SCMP_009

game:
  exe: '%ProgramData%\FAForever\bin\ForgedAlliance.exe'
  nosound: true
  tile: true

players:
  - { uid: 1, name: Original, args: ['/synclog', 'G:\projects\faf-main\tools\runs\synclog\original'] }
  - { uid: 2, name: Recovered, exe: '%ProgramData%\FAForever\bin\main.exe', args: ['/synclog', 'G:\projects\faf-main\tools\runs\synclog\recovered'] }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 5m }
  - wait: 45s

expect:
  allLaunched: true
  noDesync: true
  noCrash: true
