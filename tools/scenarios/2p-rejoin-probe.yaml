name: 2p-rejoin-probe
description: >
  The probe of issue #275. Two of our x64 clients play the AI-driven map, so the
  checksums cover a running game with no input. Player 2 is killed, and restarts
  with /rejoin: it gets the recording from player 1 over the link, catches up,
  and takes its seat back.
  Player 1 keeps the seat with net_RejoinAccept. The game must go on with no
  desync on either side; afterwards play replay-1 and replay-2-rejoin through
  the replay check. Needs init_mpemu_localvault.lua in the FAF bin folder. Do
  not click into the game windows.
timeout: 20m

mode: direct
lobby: auto
map: faf_re_lockstep
gameOptions:
  LockstepAI: rush
  Victory: sandbox           # no army's defeat ends the game during the probe
  DisconnectionDelay02: '90' # the Connectivity dialog ejects at twice this

game:
  exe: '%ProgramData%\FAForever\bin_x64\rejoin_test.exe'
  init: init_mpemu_localvault.lua
  nosound: true
  tile: true
  saveReplays: true

players:
  - { uid: 1, name: Stays, faction: uef, args: ['/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0'] }
  - { uid: 2, name: Rejoins, faction: cybran, args: ['/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0'] }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 6m }
  - wait: 2m
  - note: killing player 2
  - kill: 2
  - wait: 15s
  - note: player 2 restarts and takes its seat back
  - rejoin: { uid: 2, source: 1, peers: [{ uid: 1, source: 0 }] }
  - wait: 6m

expect:
  allLaunched: true
  noDesync: true
  noCrash: true
  logsContain:
    - { uids: [1], pattern: 'REJOIN: client \d+:\S+ served' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: received the recording' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: caught up' }
    - { uids: [1], pattern: 'REJOIN: showing \S+ as back' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: screen says connecting' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: screen says catchingUp' }
  logsAbsent:
    - { uids: [1], pattern: 'Error running .*/lua/ui/uimain|Evaluating LazyVar failed' }
    - { uids: [2], suffix: '-rejoin', pattern: 'Error running .*/lua/ui/uimain|Evaluating LazyVar failed' }
    - { uids: [1], pattern: 'has been abandoned by all players' }
    - { uids: [1], pattern: 'mismatched' }
    - { uids: [2], suffix: '-rejoin', pattern: 'mismatched' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: refused' }
