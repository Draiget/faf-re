name: 2p-recovered-hosts-original
description: >
  The recovered engine (main.exe) hosting the shipped ForgedAlliance.exe as
  the joiner: exercises the recovery's host-side lobby path (Hosting,
  AddPlayer handling, launch) against a known-good client.
timeout: 10m

mode: direct
lobby: auto
map: SCMP_009

game:
  exe: '%ProgramData%\FAForever\bin\main.exe'
  nosound: true
  tile: true

players:
  - { uid: 1, name: RecoveredHost }
  - { uid: 2, name: Original, exe: '%ProgramData%\FAForever\bin\ForgedAlliance.exe' }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 3m }
  - wait: 60s

expect:
  allLaunched: true
  noDesync: true
  noCrash: true
