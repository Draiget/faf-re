name: 8p-rejoin-4v4
description: >
  A 4v4: seven peers each have to prove, report and send. Player 2 is killed at 5 minutes. Needs init_mpemu_localvault.lua in the FAF bin folder. Do not click into the game windows.
timeout: 25m

mode: relay
lobby: auto
map: faf_re_lockstep
gameOptions:
  LockstepAI: rush
  Victory: sandbox
  DisconnectionDelay02: '90'

game:
  exe: '%ProgramData%\FAForever\bin_x64\rejoin_test.exe'
  init: init_mpemu_localvault.lua
  nosound: true
  tile: true
  saveReplays: true

players:
  - { uid: 1, name: Stays, faction: uef, args: ['/title', 'rejoin-stays', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }
  - { uid: 2, name: Rejoins, faction: cybran, args: ['/title', 'rejoin-rejoins', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }
  - { uid: 3, name: Behind, faction: aeon, args: ['/title', 'rejoin-behind', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }
  - { uid: 4, name: Four, faction: seraphim, args: ['/title', 'rejoin-four', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }
  - { uid: 5, name: Five, faction: uef, args: ['/title', 'rejoin-five', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }
  - { uid: 6, name: Six, faction: cybran, args: ['/title', 'rejoin-six', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }
  - { uid: 7, name: Seven, faction: aeon, args: ['/title', 'rejoin-seven', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }
  - { uid: 8, name: Eight, faction: seraphim, args: ['/title', 'rejoin-eight', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 6m }
  - wait: 5m
  - kill: 2
  - wait: 15s
  - note: player 2 restarts and takes its seat back
  - rejoin: { uid: 2, source: 1, peers: [{ uid: 1, source: 0 }, { uid: 3, source: 2 }, { uid: 4, source: 3 }, { uid: 5, source: 4 }, { uid: 6, source: 5 }, { uid: 7, source: 6 }, { uid: 8, source: 7 }] }
  - wait: 3m

expect:
  allLaunched: true
  noDesync: true
  noCrash: true
  logsContain:
    - { uids: [1, 3, 4, 5, 6, 7, 8], pattern: 'REJOIN: client \d+:\S+ served' }
    - { uids: [1, 3, 4, 5, 6, 7, 8], pattern: 'REJOIN: client \d+:\S+ is asked to prove its seat' }
    - { uids: [1, 3, 4, 5, 6, 7, 8], pattern: 'REJOIN: client \d+ proved its seat' }
    - { uids: [1, 3, 4, 5, 6, 7, 8], pattern: 'REJOIN: client \d+:\S+ came back on a new link' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: caught up' }
    - { uids: [1, 3, 4, 5, 6, 7, 8], pattern: 'REJOIN: showing Rejoins as lost' }
    - { uids: [1, 3, 4, 5, 6, 7, 8], pattern: 'REJOIN: showing Rejoins as loading' }
    - { uids: [1, 3, 4, 5, 6, 7, 8], pattern: 'REJOIN: showing Rejoins as back' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: showing Rejoins as back' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: screen says connecting' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: screen says (catchingUp|loading)' }
  logsAbsent:
    - { uids: [1, 3, 4, 5, 6, 7, 8], pattern: 'Error running .*/lua/ui/uimain|Evaluating LazyVar failed' }
    - { uids: [2], suffix: '-rejoin', pattern: 'Error running .*/lua/ui/uimain|Evaluating LazyVar failed' }
    - { uids: [1, 3, 4, 5, 6, 7, 8], pattern: 'has been abandoned by all players' }
    - { uids: [1, 3, 4, 5, 6, 7, 8], pattern: 'mismatched' }
    - { uids: [2], suffix: '-rejoin', pattern: 'mismatched' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: refused' }
