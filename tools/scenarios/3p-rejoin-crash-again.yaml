name: 3p-rejoin-crash-again
description: >
  The player coming back crashes again while receiving the save. The others must see that on the
  row: no response, in red, then the Connectivity dialog with its timers, and the game goes on after
  the forced ejection. Save delayed by a slower link, so the kill lands in the transfer. Uses
  mpemu-rejoin-orders. Do not click into the game windows.
timeout: 20m

mode: relay
lobby: auto
map: faf_re_lockstep
gameOptions:
  LockstepAI: rush
  Victory: sandbox
  DisconnectionDelay02: '90'

game:
  exe: '%ProgramData%\FAForever\bin_x64\rejoin_test.exe'
  init: init_mpemu_rejoin_orders.lua
  nosound: true
  tile: true
  saveReplays: true

players:
  - { uid: 1, name: Stays, faction: uef, args: ['/title', 'rejoin-orders-stays', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }
  - { uid: 2, name: Rejoins, faction: cybran, args: ['/title', 'rejoin-orders-back', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }
  - { uid: 3, name: Behind, faction: aeon, args: ['/title', 'rejoin-orders-behind', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 6m }
  - link: { from: 1, to: 2, latency: 50ms, jitter: 5ms, loss: 0.01 }
  - link: { from: 3, to: 2, latency: 50ms, jitter: 5ms, loss: 0.01 }
  - wait: 4m
  - kill: 2
  - wait: 15s
  - note: player 2 restarts, and dies again while the save comes
  - rejoin: { uid: 2, source: 1, peers: [{ uid: 1, source: 0 }, { uid: 3, source: 2 }] }
  - wait: 6s
  - kill: 2
  - wait: 4m30s

expect:
  allLaunched: true
  noDesync: true
  logsContain:
    - { uids: [1, 3], pattern: 'REJOIN: showing Rejoins as transfer' }
    - { uids: [1, 3], pattern: 'REJOIN: showing Rejoins as not responding' }
    - { uids: [1, 3], pattern: 'REJOIN: showing Rejoins as lost' }
    - { uids: [1, 3], pattern: 'rejoin-test: order first 36 from source 1 ' }
  logsAbsent:
    - { uids: [1, 3], pattern: 'mismatched' }
