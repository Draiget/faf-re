name: 2p-main-x86-vs-x86
description: >
  Baseline for 2p-main-x86-vs-x64: two instances of the recovered engine's
  x86 build (main.exe) in one match. If this does not launch and stay in sync,
  the x86-vs-x64 comparison has nothing to compare against.
timeout: 20m

mode: direct
lobby: auto
map: SCMP_009

game:
  exe: '%ProgramData%\FAForever\bin\main.exe'
  nosound: true
  tile: true

players:
  - { uid: 1, name: MainA }
  - { uid: 2, name: MainB }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 8m }
  - wait: 5m

expect:
  allLaunched: true
  noDesync: true
  noCrash: true
