name: 3p-rejoin-uneven
description: >
  Three of our x64 clients on the AI-driven map. Player 2's packets to player 3
  are cut 1.5 s before player 2 is killed, so player 3 holds about 15 fewer beats
  of its stream than player 1. Player 2 restarts with /rejoin. Its old stream must
  end at the lowest beat a peer holds, and player 1 must drop the beats past that.
  The game must go on with no desync; afterwards play every replay through the
  replay check. net_CheckOrderStreams is off: rebuilding a stream can raise a false
  alarm there, which is still open. Needs init_mpemu_localvault.lua in the FAF bin
  folder. Do not click into the game windows.
timeout: 20m

mode: relay
lobby: auto
map: faf_re_lockstep
gameOptions:
  LockstepAI: rush
  Victory: sandbox
  DisconnectionDelay02: '90'

game:
  exe: '%ProgramData%\FAForever\bin_x64\rejoin_test.exe'
  init: init_mpemu_localvault.lua
  nosound: true
  tile: true
  saveReplays: true

players:
  - { uid: 1, name: Stays, faction: uef, args: ['/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0'] }
  - { uid: 2, name: Rejoins, faction: cybran, args: ['/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0'] }
  - { uid: 3, name: Behind, faction: aeon, args: ['/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0'] }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 6m }
  - wait: 2m
  - note: cutting player 2 to player 3, then killing player 2
  - link: { from: 2, to: 3, oneWay: true, blocked: true }
  - wait: 1500ms
  - kill: 2
  - wait: 15s
  - link: { from: 2, to: 3, oneWay: true, blocked: false }
  - note: player 2 restarts and takes its seat back
  - rejoin: { uid: 2, source: 1, peers: [{ uid: 1, source: 0 }, { uid: 3, source: 2 }] }
  - wait: 6m

expect:
  allLaunched: true
  noDesync: true
  noCrash: true
  logsContain:
    - { uids: [1, 3], pattern: 'REJOIN: client \d+:\S+ served' }
    - { uids: [1], pattern: 'REJOIN: client \d+.s old stream cut at beat \d+, [1-9]\d* beats dropped' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: received the recording' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: caught up' }
    - { uids: [1], pattern: 'REJOIN: showing \S+ as back' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: screen says connecting' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: screen says catchingUp' }
  logsAbsent:
    - { uids: [1, 3], pattern: 'Error running .*/lua/ui/uimain|Evaluating LazyVar failed' }
    - { uids: [2], suffix: '-rejoin', pattern: 'Error running .*/lua/ui/uimain|Evaluating LazyVar failed' }
    - { uids: [1, 3], pattern: 'has been abandoned by all players' }
    - { uids: [1, 3], pattern: 'mismatched' }
    - { uids: [2], suffix: '-rejoin', pattern: 'mismatched' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: refused' }
