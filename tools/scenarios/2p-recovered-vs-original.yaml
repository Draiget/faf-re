name: 2p-recovered-vs-original
description: >
  The recovered engine (main.exe) against the shipped ForgedAlliance.exe in
  one match. Both simulate every beat and exchange checksums, so any
  simulation divergence in the recovery surfaces as a GPGNet "Desync" report,
  and a crash as an unexpected process exit.
timeout: 15m

mode: direct
lobby: auto
map: SCMP_009

game:
  exe: '%ProgramData%\FAForever\bin\ForgedAlliance.exe'
  nosound: true
  tile: true

players:
  - { uid: 1, name: Original }
  - { uid: 2, name: Recovered, exe: '%ProgramData%\FAForever\bin\main.exe' }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 5m }
  - wait: 5m

expect:
  allLaunched: true
  noDesync: true
  noCrash: true
