name: 2p-main-x86-vs-x64-prebuilt-dbg
description: >
  2p-main-x86-vs-x64 with the x64 client started through a local debugger
  wrapper (scratchpad main_x64_dbg.cmd -> dbgrun64), so a crash in the x64
  build yields a symbolised stack. Prebuilt bases, four minutes after launch.
timeout: 12m

mode: direct
lobby: auto
map: SCMP_009
gameOptions:
  PrebuiltUnits: 'On'

game:
  exe: '%ProgramData%\FAForever\bin\main.exe'
  nosound: true
  tile: true

players:
  - { uid: 1, name: MainX86 }
  - { uid: 2, name: MainX64, exe: 'C:\Users\Draiget\AppData\Local\Temp\claude\g--projects-faf-main\0fdbf055-1702-4699-8733-d4eee99ffde8\scratchpad\x64fp\main_x64_dbg.cmd' }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 4m }
  - wait: 4m

expect:
  allLaunched: true
  noDesync: true
  noCrash: true
