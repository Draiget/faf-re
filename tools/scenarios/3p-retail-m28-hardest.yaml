name: 3p-retail-m28-hardest
description: >
  The shipped ForgedAlliance.exe, our x86 main_net_x86.exe and our x64
  main_net.exe play one FFA on faf_re_lockstep with every army handed to
  M28AI at its hardest: the AIx personality (m28aicheat), cheat and build
  multipliers 5.9 (the lobby's highest), full-map omni. The autolobby never
  enables sim mods, so init_mpemu_m28.lua (a copy of init_mpemu_localvault.lua
  in the FAF bin and bin_x64 folders) also mounts tools/scenarios/mpemu-m28 at
  /, whose schook hook launches every client with the vault's M28AI; the
  vault's faf_re_lockstep script must allow the m28ai/m28aicheat
  personalities. Expect all to launch, no desync, no crash,
  and every client to log the same mod and personalities. Our clients run as
  game version 3835 to match the shipped exe. Do not click into the game
  windows.
timeout: 40m

mode: direct
lobby: auto
map: faf_re_lockstep
gameOptions:
  LockstepAI: m28aicheat
  CheatMult: '5.9'
  BuildMult: '5.9'
  OmniCheat: 'on'
  Victory: demoralization
  GameSpeed: fast

game:
  exe: '%ProgramData%\FAForever\bin\ForgedAlliance.exe'
  init: init_mpemu_m28.lua
  nosound: true
  tile: true
  saveReplays: true

players:
  - { uid: 1, name: Retail, faction: uef, args: ['/title', 'm28-retail'] }
  - { uid: 2, name: FafRe-x86, faction: aeon, exe: '%ProgramData%\FAForever\bin\main_net_x86.exe', args: ['/title', 'm28-x86', '/con', 'sim_FafGameVersion=3835'] }
  - { uid: 3, name: FafRe-x64, faction: cybran, exe: '%ProgramData%\FAForever\bin_x64\main_net.exe', args: ['/title', 'm28-x64', '/con', 'sim_FafGameVersion=3835'] }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 6m }
  - wait: 25m

expect:
  allLaunched: true
  noDesync: true
  noCrash: true
  logsAgree:
    - { uids: all, pattern: 'mpemu-m28: launching with sim mod (M28AI v\d+ \S+)' }
    - { uids: all, pattern: 'faf_re_lockstep: (handover .*|handed \d+ armies to the AI)' }
    - { uids: all, pattern: 'faf_re_lockstep: (army \d+ \S+ brain=\S+ skirmish=\S+ personality=\S+ faction=\d+)' }
