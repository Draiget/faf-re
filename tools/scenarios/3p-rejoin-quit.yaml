name: 3p-rejoin-quit
description: >
  A player quits normally. With rejoin on, that must not hold their seat: the others go on as
  in any game, with no one waiting for them to come back. Uses mpemu-rejoin-orders. Do not
  click into the game windows.
timeout: 20m

mode: relay
lobby: auto
map: faf_re_lockstep
gameOptions:
  LockstepAI: rush
  Victory: sandbox
  DisconnectionDelay02: '90'

game:
  exe: '%ProgramData%\FAForever\bin_x64\rejoin_test.exe'
  init: init_mpemu_rejoin_orders.lua
  nosound: true
  tile: true
  saveReplays: true

players:
  - { uid: 1, name: Stays, faction: uef, args: ['/title', 'rejoin-orders-stays', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }
  - { uid: 2, name: Rejoins, faction: cybran, args: ['/testquit', '/title', 'rejoin-orders-back', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }
  - { uid: 3, name: Behind, faction: aeon, args: ['/title', 'rejoin-orders-behind', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 6m }
  - wait: 5m

expect:
  allLaunched: true
  noDesync: true
  logsContain:
    - { uids: [2], pattern: 'rejoin-test: quitting' }
    - { uids: [1, 3], pattern: 'rejoin-test: order first 21 from source 1 ' }
  logsAbsent:
    - { uids: [1, 3], pattern: 'seat held' }
    - { uids: [1, 3], pattern: 'REJOIN: showing Rejoins as lost' }
    - { uids: [1, 3], pattern: 'mismatched' }
