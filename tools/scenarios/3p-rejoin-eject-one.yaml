name: 3p-rejoin-eject-one
description: >
  One of two players votes to eject while a killed player is coming back, during the transfer of the save.
  The other player's dialog must say who voted, and the player coming back is told at once why it can't have its seat. The game goes on as the original game does with one vote: once the other player's dialog ejects them after its time. Uses mpemu-rejoin-orders, whose hook votes in clients
  started with /testejectvote. init_mpemu_rejoin_orders.lua must be in the FAF bin and
  bin_x64 folders. Do not click into the game windows.
timeout: 20m

mode: relay
lobby: auto
map: faf_re_lockstep
gameOptions:
  LockstepAI: rush
  Victory: sandbox
  DisconnectionDelay02: '90'

game:
  exe: '%ProgramData%\FAForever\bin_x64\rejoin_test.exe'
  init: init_mpemu_rejoin_orders.lua
  nosound: true
  tile: true
  saveReplays: true

players:
  - { uid: 1, name: Stays, faction: uef, args: ['/testejectvote', '/title', 'rejoin-orders-stays', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }
  - { uid: 2, name: Rejoins, faction: cybran, args: ['/title', 'rejoin-orders-back', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }
  - { uid: 3, name: Behind, faction: aeon, args: ['/title', 'rejoin-orders-behind', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 6m }
  - wait: 4m
  - kill: 2
  - wait: 15s
  - note: player 2 restarts and takes its seat back
  - rejoin: { uid: 2, source: 1, peers: [{ uid: 1, source: 0 }, { uid: 3, source: 2 }] }
  - wait: 5m

expect:
  allLaunched: true
  noDesync: true
  noCrash: true
  logsContain:
    - { uids: [1], pattern: 'rejoin-test: voting to eject client 2' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: refused: A player voted to eject you' }
    - { uids: [1, 3], pattern: 'rejoin-test: order first 21 from source 1 ' }
  logsAbsent:
    - { uids: [1, 3], pattern: 'mismatched' }
