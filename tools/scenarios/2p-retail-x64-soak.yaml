name: 2p-retail-x64-soak
description: >
  2-player version of 3p-original-x86-x64-ai: the shipped ForgedAlliance.exe
  (uid 1) and our x64 build staged as bin_x64\main_x64_soak.exe (uid 2) play one
  match on faf_re_lockstep, where the map script hands every army to FAF's AI.
  Soak: latest master on the Automatic renderer (D3D12) with /simworkers 8.
  Compare the "faf_re_lockstep: status tick=N ..." lines across game-*.log.
  Needs init_mpemu_localvault.lua. Run with -advertise 192.168.42.77 on the
  isolated account. Do not click into the game windows.
timeout: 50m

mode: direct
lobby: auto
map: faf_re_lockstep
gameOptions:
  LockstepAI: rush
  Victory: demoralization
  GameSpeed: fast

game:
  exe: '%ProgramData%\FAForever\bin\ForgedAlliance.exe'
  init: init_mpemu_localvault.lua
  nosound: true
  tile: true
  saveReplays: true

players:
  - { uid: 1, name: Retail, faction: uef, args: ['/title', 'soak-mp-retail'] }
  - { uid: 2, name: FafRe-x64, faction: cybran, exe: '%ProgramData%\FAForever\bin_x64\main_x64_soak.exe', args: ['/simworkers', '8', '/title', 'soak-mp-x64'] }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 6m }
  - wait: 35m

expect:
  allLaunched: true
  noDesync: true
  noCrash: true
  logsAgree:
    - { uids: all, pattern: 'faf_re_lockstep: (handover .*|handed \d+ armies to the AI)' }
    - { uids: all, pattern: 'faf_re_lockstep: (army \d+ \S+ brain=\S+ skirmish=\S+ personality=\S+ faction=\d+)' }
