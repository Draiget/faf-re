name: 3p-rejoin-m28-late
description: >
  A late drop in a heavy game. Every army is handed to M28AI at its hardest, as in
  3p-retail-m28-hardest, and after 15 minutes, when the sim holds far more than in
  3p-rejoin-demo, player 2 is killed. 15 s later it starts again and takes its seat
  back from a save. Shows what a save of a grown game costs in time and size, and
  that a game running a sim mod can be rejoined. Needs init_mpemu_m28.lua in the FAF
  bin folder. Do not click into the game windows.
timeout: 40m

mode: relay
lobby: auto
map: faf_re_lockstep
gameOptions:
  LockstepAI: m28aicheat
  CheatMult: '5.9'
  BuildMult: '5.9'
  OmniCheat: 'on'
  Victory: sandbox
  DisconnectionDelay02: '300'

game:
  exe: '%ProgramData%\FAForever\bin_x64\rejoin_test.exe'
  init: init_mpemu_m28.lua
  nosound: true
  tile: true
  saveReplays: true

players:
  - { uid: 1, name: Stays, faction: uef, args: ['/title', 'rejoin-m28-stays', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }
  - { uid: 2, name: Rejoins, faction: cybran, args: ['/title', 'rejoin-m28-back', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }
  - { uid: 3, name: Behind, faction: aeon, args: ['/title', 'rejoin-m28-behind', '/con', 'net_PeerFeatures=1;net_RejoinAccept=1;net_CheckOrderStreams=0;net_LogShownBeatMs=500'] }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 6m }
  - wait: 15m
  - kill: 2
  - wait: 15s
  - note: player 2 restarts and takes its seat back
  - rejoin: { uid: 2, source: 1, peers: [{ uid: 1, source: 0 }, { uid: 3, source: 2 }] }
  - wait: 4m

expect:
  allLaunched: true
  noDesync: true
  noCrash: true
  logsAgree:
    - { uids: all, pattern: 'mpemu-m28: launching with sim mod (M28AI v\d+ \S+)' }
    - { uids: all, pattern: 'faf_re_lockstep: (handover .*|handed \d+ armies to the AI)' }
  logsContain:
    - { uids: [1, 3], pattern: 'REJOIN: client \d+:\S+ is asked to prove its seat' }
    - { uids: [1, 3], pattern: 'REJOIN: client \d+ proved its seat' }
    - { uids: [1, 3], pattern: 'REJOIN: client \d+:\S+ served' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: caught up' }
    - { uids: [1, 3], pattern: 'REJOIN: showing Rejoins as back' }
  logsAbsent:
    - { uids: [1, 3], pattern: 'has been abandoned by all players' }
    - { uids: [1, 3], pattern: 'mismatched' }
    - { uids: [2], suffix: '-rejoin', pattern: 'mismatched' }
    - { uids: [2], suffix: '-rejoin', pattern: 'REJOIN: refused' }
