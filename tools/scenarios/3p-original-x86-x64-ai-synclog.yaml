name: 3p-original-x86-x64-ai-synclog
description: >
  Three-way lockstep parity under real gameplay: the shipped ForgedAlliance.exe,
  our x86 main.exe and our x64 main_x64.exe play one FFA on faf_re_lockstep
  (Seton's Clutch whose map script hands every player army to FAF's built-in
  AI at sim start), so all three armies expand, build factories and units and
  fight with nobody touching the windows. Any engine difference shows as a
  Desync. Every client writes /synclog (one checksum log per beat with every
  value fed into the sim MD5), so the first diverging input can be found by
  diffing the same beat across runs\synclog\{original,x86,x64}. synclog slows
  the sim a lot; 3p-original-x86-x64-ai.yaml is the long run without it.
  Needs init_mpemu_localvault.lua in the FAF bin folder (mounts the workspace
  vault that holds the map). Do not click into the game windows: a local
  selection feeds DebugGetSelection(), which the AI debug threads read.
timeout: 75m

mode: direct
lobby: auto
map: faf_re_lockstep
gameOptions:
  LockstepAI: rush        # map script option: rush | adaptive | tech | turtle | mixed
  Victory: demoralization   # commander death defeats the army: covers defeat and game-end paths
  GameSpeed: fast         # fixed +4 cap; lockstep still runs at the slowest client

game:
  exe: '%ProgramData%\FAForever\bin\ForgedAlliance.exe'
  init: init_mpemu_localvault.lua   # resolved against %ProgramData%\FAForever\bin
  nosound: true
  tile: true

players:
  - { uid: 1, name: Retail, faction: uef,    args: ['/synclog', 'G:\projects\faf-main\tools\runs\synclog\original'] }
  - { uid: 2, name: FafRe-x86,  faction: aeon,   exe: '%ProgramData%\FAForever\bin\main_head.exe', args: ['/synclog', 'G:\projects\faf-main\tools\runs\synclog\x86'] }
  - { uid: 3, name: FafRe-x64,  faction: cybran, exe: '%ProgramData%\FAForever\bin_x64\main_x64_head.exe', args: ['/synclog', 'G:\projects\faf-main\tools\runs\synclog\x64'] }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 6m }
  - wait: 60m

expect:
  allLaunched: true
  noDesync: true
  noCrash: true
  logsAgree:
    # the map script's handover ran identically on every client
    - { uids: all, pattern: 'faf_re_lockstep: (handover .*|handed \d+ armies to the AI)' }
    - { uids: all, pattern: 'faf_re_lockstep: (army \d+ \S+ brain=\S+ skirmish=\S+ personality=\S+ faction=\d+)' }
