name: 3p-retail-net-hardening
description: >
  Regression run for the lobby/multiplayer hardening: the shipped
  ForgedAlliance.exe, our x86 main_net_x86.exe and our x64 main_net.exe play
  one FFA on faf_re_lockstep with every army handed to FAF's built-in AI.
  Valid traffic must behave exactly as before: all launch, no desync, no crash.
  Needs init_mpemu_localvault.lua in the FAF bin folder. Do not click into the
  game windows. Our clients take the game version from the game data
  (/lua/version.lua), the same release as the shipped exe, without any
  setting.
timeout: 40m

mode: direct
lobby: auto
map: faf_re_lockstep
gameOptions:
  LockstepAI: rush
  Victory: demoralization
  GameSpeed: fast

game:
  exe: '%ProgramData%\FAForever\bin\ForgedAlliance.exe'
  init: init_mpemu_localvault.lua
  nosound: true
  tile: true
  saveReplays: true

players:
  - { uid: 1, name: Retail, faction: uef, args: ['/title', 'net-retail'] }
  - { uid: 2, name: FafRe-x86, faction: aeon, exe: '%ProgramData%\FAForever\bin\main_net_x86.exe', args: ['/title', 'net-x86'] }
  - { uid: 3, name: FafRe-x64, faction: cybran, exe: '%ProgramData%\FAForever\bin_x64\main_net.exe', args: ['/title', 'net-x64'] }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 6m }
  - wait: 25m

expect:
  allLaunched: true
  noDesync: true
  noCrash: true
  logsAgree:
    - { uids: all, pattern: 'faf_re_lockstep: (handover .*|handed \d+ armies to the AI)' }
    - { uids: all, pattern: 'faf_re_lockstep: (army \d+ \S+ brain=\S+ skirmish=\S+ personality=\S+ faction=\d+)' }
    - { uids: [2, 3], pattern: 'FAF game version (\d+) \(game data\)' }
